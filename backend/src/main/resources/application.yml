spring:
  datasource:
    url: jdbc:h2:mem:digitaltwin
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

server:
  port: 8080

app:
  cors:
    allowed-origins: http://localhost:5173,http://localhost:3000
