server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Use Docker's internal DNS resolver to prevent Nginx from crashing 
    # if the backend container is slightly delayed in starting up.
    resolver 127.0.0.11 valid=10s;

    # Handle React routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to the backend
    location /api/ {
        # Using a variable forces Nginx to resolve the DNS at runtime instead of startup
        set $backend "http://backend:8080";
        proxy_pass $backend;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
